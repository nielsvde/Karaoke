<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Stream Audio & AI Teleprompter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .audio-box {
      background: #090d16;
      padding: 12px;
      border-radius: 8px;
    }

    audio { width: 100%; margin-top: 8px; }

    .prompter-container {
      height: 260px;
      overflow-y: auto;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 20px;
      font-size: 1.3rem;
      line-height: 1.8;
      background-color: #090d16;
    }

    /* Zinnen styling */
    .sentence {
      opacity: 0.25; /* Volgende zinnen zijn lichtgrijs al zichtbaar */
      transition: opacity 0.3s ease, color 0.3s ease;
      display: inline;
    }

    .sentence.active {
      opacity: 1;
      font-weight: bold;
      color: #38bdf8; /* Actieve zin lopt blauw op */
    }

    .sentence.passed {
      opacity: 0.5;
      color: #94a3b8;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button.success { background-color: #10b981; }
    button.secondary { background-color: #475569; }

    textarea {
      width: 100%;
      height: 80px;
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>Audio Streams & Synced Prompter</h1>

  <!-- 1. Twee MP3 Streams -->
  <div class="card">
    <h3>1. MP3 Audio Streams</h3>
    <div class="audio-grid">
      <div class="audio-box">
        <label>Stream A (Spraak / Hoofdaudio)</label>
        <audio id="audioA" controls crossorigin="anonymous"></audio>
        <input type="text" id="urlA" placeholder="MP3 Stream A URL..." style="width:100%; margin-top:5px;">
      </div>
      <div class="audio-box">
        <label>Stream B (Achtergrond / Muziek)</label>
        <audio id="audioB" controls crossorigin="anonymous"></audio>
        <input type="text" id="urlB" placeholder="MP3 Stream B URL..." style="width:100%; margin-top:5px;">
      </div>
    </div>
    <div class="btn-group">
      <button id="loadAudioBtn" class="secondary">Laad MP3's</button>
      <button id="syncPlayBtn" class="success">▶ Synchroon Afspelen</button>
      <button id="syncPauseBtn" class="secondary">⏸ Pauzeer Beide</button>
    </div>
  </div>

  <!-- 2. AI Tekst Opslaan & Laden -->
  <div class="card">
    <h3>2. AI Tekst Genereren & Eenmalig Opslaan</h3>
    <textarea id="aiText" placeholder="Gegenereerde tekst komt hier..."></textarea>
    <div class="btn-group">
      <button id="generateBtn">🤖 Genereer AI Tekst</button>
      <button id="saveFileBtn" class="success">💾 Bewaar als .txt Bestand</button>
      <input type="file" id="loadFileBtn" accept=".txt" style="display:none;">
      <button id="triggerLoadBtn" class="secondary">📁 Opgeslagen Tekst Laden</button>
    </div>
  </div>

  <!-- 3. Teleprompter -->
  <div class="card">
    <h3>3. Meelopende Tekst</h3>
    <div class="prompter-container" id="prompter">
      <div id="content"><em>Genereer of laad een tekstbestand om te beginnen...</em></div>
    </div>
  </div>

  <script>
    const audioA = document.getElementById('audioA');
    const audioB = document.getElementById('audioB');
    const aiText = document.getElementById('aiText');
    const content = document.getElementById('content');

    let sentences = [];
    let activeIndex = 0;

    // 1. Audio Control
    document.getElementById('loadAudioBtn').addEventListener('click', () => {
      if (document.getElementById('urlA').value) audioA.src = document.getElementById('urlA').value;
      if (document.getElementById('urlB').value) audioB.src = document.getElementById('urlB').value;
    });

    document.getElementById('syncPlayBtn').addEventListener('click', () => {
      audioA.play();
      audioB.play();
    });

    document.getElementById('syncPauseBtn').addEventListener('click', () => {
      audioA.pause();
      audioB.pause();
    });

    // 2. Simuleer AI generatie (of koppel hier je OpenAI API fetch aan)
    document.getElementById('generateBtn').addEventListener('click', () => {
      const generated = "Dit is het eerste gedeelte van de tegen de AI gevraagde tekst. " +
        "De app bewaart dit bestand zodat je het later gratis hergebruikt. " +
        "Terwijl Stream A en Stream B lopen, scrolt de tekst synchroon mee. " +
        "De volgende zin staat telkens alvast zichtbaar in het lichtgrijs onderaan.";
      
      aiText.value = generated;
      preparePrompter(generated);
    });

    // Verwerk tekst in zinnen
    function preparePrompter(text) {
      sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      content.innerHTML = sentences
        .map((s, index) => `<span class="sentence ${index === 0 ? 'active' : ''}" id="s-${index}">${s.trim()} </span>`)
        .join('');
      activeIndex = 0;
    }

    // Tekst opslaan als .txt bestand
    document.getElementById('saveFileBtn').addEventListener('click', () => {
      const textToSave = aiText.value;
      if (!textToSave) return alert("Er is nog geen tekst om op te slaan!");
      
      const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mijn_ai_tekst.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Opgeslagen .txt bestand inlezen
    document.getElementById('triggerLoadBtn').addEventListener('click', () => document.getElementById('loadFileBtn').click());
    document.getElementById('loadFileBtn').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        aiText.value = evt.target.result;
        preparePrompter(evt.target.result);
      };
      reader.readAsText(file);
    });

    // 3. Meescrollen op basis van de MP3 tijdsduur (Stream A)
    audioA.addEventListener('timeupdate', () => {
      if (!sentences.length || !audioA.duration) return;

      const progress = audioA.currentTime / audioA.duration;
      const targetIndex = Math.min(Math.floor(progress * sentences.length), sentences.length - 1);

      if (targetIndex !== activeIndex) {
        activeIndex = targetIndex;
        document.querySelectorAll('.sentence').forEach((el, idx) => {
          if (idx < activeIndex) el.className = 'sentence passed';
          else if (idx === activeIndex) {
            el.className = 'sentence active';
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } else {
            el.className = 'sentence';
          }
        });
      }
    });
  </script>
</body>
</html>

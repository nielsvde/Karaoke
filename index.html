<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke party</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            color: #00d2ff;
        }

        .file-input-wrapper {
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 2px solid #00d2ff;
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            background-color: transparent;
            color: #00d2ff;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #00d2ff;
            color: #121212;
        }

        #track-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff007f;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3em;
            max-height: 2.6em;
            word-break: break-word;
        }

        .playlist-container {
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
            display: none;
        }

        .playlist-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }

        .playlist-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            outline: none;
            font-size: 14px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #00d2ff;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #0099cc;
        }

        #lyrics-display {
            font-size: 22px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #333;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Karaoke party</h1>

        <div class="file-input-wrapper">
            <label for="file-input" class="custom-file-upload">
                Selecteer bestanden
            </label>
            <input id="file-input" type="file" accept="audio/*,.lrc" multiple />
        </div>

        <div class="playlist-container" id="playlist-wrapper">
            <label for="playlist-select">Kies een nummer uit de lijst:</label>
            <select id="playlist-select" class="playlist-select"></select>
        </div>

        <div id="track-title">Geen nummer geladen</div>

        <div class="controls">
            <button id="btn-play" disabled>Speel af</button>
            <button id="btn-pause" disabled>Pauze</button>
            <button id="btn-stop" disabled>Stop</button>
        </div>

        <div id="lyrics-display">---</div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const fileInput = document.getElementById('file-input');
        const playlistWrapper = document.getElementById('playlist-wrapper');
        const playlistSelect = document.getElementById('playlist-select');
        const trackTitle = document.getElementById('track-title');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const lyricsDisplay = document.getElementById('lyrics-display');
        const audioPlayer = document.getElementById('audio-player');

        let playlist = [];
        let lyrics = [];
        let lyricTimer = null;

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Scheid audio bestanden van eventuele losse LRC bestanden
            const audioFiles = files.filter(f => f.type.startsWith('audio/') || f.name.endsWith('.mp3') || f.name.endsWith('.wav') || f.name.endsWith('.ogg'));
            const lrcFiles = files.filter(f => f.name.endsWith('.lrc'));

            if (audioFiles.length === 0) {
                alert("Selecteer minimaal één audiobestand.");
                return;
            }

            playlist = audioFiles.map(audioFile => {
                const baseName = audioFile.name.substring(0, audioFile.name.lastIndexOf('.'));
                const matchingLrc = lrcFiles.find(lrc => lrc.name.substring(0, lrc.name.lastIndexOf('.')) === baseName);
                return {
                    audio: audioFile,
                    lrc: matchingLrc || null
                };
            });

            playlistSelect.innerHTML = '';
            playlist.forEach((item, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = item.audio.name;
                playlistSelect.appendChild(option);
            });

            playlistWrapper.style.display = 'block';
            playlistSelect.selectedIndex = 0;
            loadTrack(0);
        });

        playlistSelect.addEventListener('change', (e) => {
            const index = parseInt(e.target.value, 10);
            loadTrack(index);
        });

        async function loadTrack(index) {
            stopPlayback();
            const item = playlist[index];
            if (!item) return;

            trackTitle.textContent = item.audio.name;
            audioPlayer.src = URL.createObjectURL(item.audio);

            lyrics = [];
            lyricsDisplay.textContent = "Klaar voor afspelen...";

            if (item.lrc) {
                const text = await item.lrc.text();
                lyrics = parseLRC(text);
            }

            btnPlay.disabled = false;
            btnPause.disabled = false;
            btnStop.disabled = false;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            for (let line of lines) {
                const match = timeRegex.exec(line);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const ms = parseInt(match[3].padEnd(3, '0'), 10);
                    const time = minutes * 60 + seconds + ms / 1000;
                    const text = line.replace(timeRegex, '').trim();
                    if (text) {
                        result.push({ time, text });
                    }
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        audioPlayer.addEventListener('timeupdate', () => {
            if (lyrics.length === 0) return;

            const currentTime = audioPlayer.currentTime;
            let currentText = "---";

            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    currentText = lyrics[i].text;
                } else {
                    break;
                }
            }
            lyricsDisplay.textContent = currentText;
        });

        btnPlay.addEventListener('click', () => {
            audioPlayer.play();
        });

        btnPause.addEventListener('click', () => {
            audioPlayer.pause();
        });

        btnStop.addEventListener('click', () => {
            stopPlayback();
        });

        function stopPlayback() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            lyricsDisplay.textContent = "---";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke party</title>
    <script src="https://cdn.jsdelivr.net/npm/spessasynth_lib@2.2.0/dist/spessasynth_lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            color: #00d2ff;
        }

        .file-input-wrapper {
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 2px solid #00d2ff;
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            background-color: transparent;
            color: #00d2ff;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #00d2ff;
            color: #121212;
        }

        #track-title {
            font-weight: bold;
            margin-bottom: 15px;
            color: #ff007f;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3em;
            max-height: 2.6em;
            word-break: break-word;
        }

        /* Afspeellijst styling */
        .playlist-container {
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
            display: none;
        }

        .playlist-container label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }

        .playlist-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            outline: none;
            font-size: 14px;
            cursor: pointer;
        }

        .playlist-select option {
            padding: 5px;
            background-color: #2a2a2a;
            color: #fff;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: #00d2ff;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #0099cc;
        }

        #lyrics-display {
            font-size: 24px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Karaoke party</h1>

        <div class="file-input-wrapper">
            <label for="file-input" class="custom-file-upload">
                Selecteer bestanden
            </label>
            <input id="file-input" type="file" accept=".kar,.mid,.midi" multiple />
        </div>

        <div class="playlist-container" id="playlist-wrapper">
            <label for="playlist-select">Kies een nummer uit de lijst:</label>
            <select id="playlist-select" class="playlist-select"></select>
        </div>

        <div id="track-title">Geen nummer geladen</div>

        <div class="controls">
            <button id="btn-play" disabled>Speel af</button>
            <button id="btn-pause" disabled>Pauze</button>
            <button id="btn-stop" disabled>Stop</button>
        </div>

        <div id="lyrics-display">
            ---
        </div>
    </div>

    <script>
        let synth = null;
        let seq = null;
        let isInitialized = false;
        let playlist = [];

        const fileInput = document.getElementById('file-input');
        const playlistWrapper = document.getElementById('playlist-wrapper');
        const playlistSelect = document.getElementById('playlist-select');
        const trackTitle = document.getElementById('track-title');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const lyricsDisplay = document.getElementById('lyrics-display');

        async function initEngine() {
            if (isInitialized) return;
            
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Laden van Default SoundFont via SpessaSynth
            const sfResponse = await fetch("https://cdn.jsdelivr.net/gh/spessasymphony/Soundfont@main/GeneralUserGS.sf2");
            const sfArrayBuffer = await sfResponse.arrayBuffer();
            
            synth = new SpessaSynth.Synthesizer(audioCtx.destination, sfArrayBuffer);
            seq = new SpessaSynth.Sequencer(synth);
            
            // Lyrics callback koppelen
            seq.onText = (text, type) => {
                if (text) {
                    lyricsDisplay.textContent = text;
                }
            };

            isInitialized = true;
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            playlist = files;
            playlistSelect.innerHTML = '';

            playlist.forEach((file, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = file.name;
                playlistSelect.appendChild(option);
            });

            playlistWrapper.style.display = 'block';

            // Laad het eerste nummer in de lijst
            playlistSelect.selectedIndex = 0;
            await loadSelectedTrack(0);
        });

        playlistSelect.addEventListener('change', async (e) => {
            const selectedIndex = parseInt(e.target.value, 10);
            await loadSelectedTrack(selectedIndex);
        });

        async function loadSelectedTrack(index) {
            const file = playlist[index];
            if (!file) return;

            if (!isInitialized) {
                await initEngine();
            }

            const arrayBuffer = await file.arrayBuffer();
            
            // Laad MIDI/KAR in de sequencer
            seq.loadMIDI(arrayBuffer);
            
            trackTitle.textContent = file.name;
            lyricsDisplay.textContent = "Klaar voor afspelen...";

            btnPlay.disabled = false;
            btnPause.disabled = false;
            btnStop.disabled = false;
        }

        btnPlay.addEventListener('click', () => {
            if (seq) {
                seq.play();
            }
        });

        btnPause.addEventListener('click', () => {
            if (seq) {
                seq.pause();
            }
        });

        btnStop.addEventListener('click', () => {
            if (seq) {
                seq.stop();
                lyricsDisplay.textContent = "---";
            }
        });
    </script>
</body>
</html>

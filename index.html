<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Karaoke Duo Player + Package Export/Import</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Karaoke Duo Player","short_name":"KaraokeApp","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://via.placeholder.com/192/6366f1/ffffff?text=Karaoke","sizes":"192x192","type":"image/png"},{"src":"https://via.placeholder.com/512/6366f1/ffffff?text=Karaoke","sizes":"512x512","type":"image/png"}]}'>

  <!-- JSZip Bibliotheek voor ZIP exporteren en importeren -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #6366f1;
      --accent-vocal: #ec4899;
      --accent-music: #06b6d4;
      --accent-lrc: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    header p { font-size: 0.85rem; color: var(--text-muted); }

    .package-box {
      background: rgba(99, 102, 241, 0.15);
      border: 1px dashed #818cf8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .package-box-title { font-size: 0.8rem; font-weight: 700; color: #a5b4fc; }
    .package-actions { display: flex; gap: 8px; }

    .file-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .file-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .file-card.loaded { border-style: solid; border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .file-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 10px; flex: 1; }
    .file-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .file-label.music { color: var(--accent-music); }
    .file-label.vocal { color: var(--accent-vocal); }
    .file-label.lrc { color: var(--accent-lrc); }
    .file-name { font-size: 0.85rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .select-lrc {
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .btn-file {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-pkg {
      flex: 1;
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid #818cf8;
      color: #ffffff;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-pkg:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type="file"] { display: none; }

    .lyrics-wrapper { position: relative; margin-bottom: 12px; }
    .btn-fullscreen {
      position: absolute;
      top: 10px; right: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    .btn-close-fullscreen {
      display: none;
      position: absolute;
      top: 16px; right: 16px; z-index: 10000;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .lyrics-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 180px;
      overflow-y: auto;
      padding: 60px 16px;
      text-align: center;
      scroll-behavior: smooth;
    }
    .lyric-line {
      padding: 8px 12px;
      font-size: 1.05rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 0.25s ease, color 0.25s ease;
      margin-bottom: 6px;
      line-height: 1.5;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lyric-line.active {
      font-weight: 700;
      color: #ffffff;
      transform: scale(1.15);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 24px rgba(99, 102, 241, 0.6);
    }

    .lyrics-wrapper.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      margin: 0; padding: 20px 20px 0 20px;
      display: flex; flex-direction: column;
    }
    .lyrics-wrapper.fullscreen .lyrics-container { height: 100%; border-radius: 20px; padding: 35vh 20px 180px 20px; }
    .lyrics-wrapper.fullscreen .lyric-line { font-size: 1.8rem; padding: 12px 20px; margin-bottom: 12px; min-height: 64px; }
    .lyrics-wrapper.fullscreen .lyric-line.active { transform: scale(1.2); }
    .lyrics-wrapper.fullscreen .btn-fullscreen { display: none !important; }
    .lyrics-wrapper.fullscreen .btn-close-fullscreen { display: flex !important; }

    .fs-player-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 10001;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
    }
    .lyrics-wrapper.fullscreen .fs-player-overlay { display: block; }

    .fs-toggle-btn {
      display: flex; align-items: center; justify-content: center;
      background: rgba(30, 41, 59, 0.95); border: 1px solid var(--border-color); border-bottom: none;
      color: var(--text-muted); width: 48px; height: 24px; border-radius: 12px 12px 0 0; margin: 0 auto; cursor: pointer;
    }
    .fs-toggle-btn.collapsed svg { transform: rotate(180deg); }

    .fs-card-inner {
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 16px; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
      display: flex; flex-direction: column; gap: 12px; transition: max-height 0.35s ease, opacity 0.35s ease;
      overflow: hidden; max-height: 300px; opacity: 1;
    }
    .fs-player-overlay.collapsed .fs-card-inner { max-height: 0; padding: 0 16px; border: none; opacity: 0; pointer-events: none; }

    .offset-control {
      background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;
    }
    .offset-header { display: flex; justify-content: space-between; align-items: center; }
    .offset-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .offset-value { font-size: 0.9rem; font-weight: 700; color: var(--accent-lrc); font-family: monospace; }
    .offset-btns { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .btn-offset {
      flex: 1; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 6px 0; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center;
    }

    .progress-section { margin-bottom: 20px; }
    .fs-card-inner .progress-section { margin-bottom: 0; }
    .time-display { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

    .controls-main { display: flex; gap: 12px; margin-bottom: 20px; }
    .fs-card-inner .controls-main { margin-bottom: 0; gap: 10px; }
    .btn-action {
      flex: 1; padding: 14px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-play { background: var(--primary); color: white; }
    .btn-play:disabled { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); cursor: not-allowed; }
    .btn-stop { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

    .mixer-section { display: flex; flex-direction: column; gap: 14px; }
    .channel { background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); }
    .fs-card-inner .channel { padding: 10px 12px; }
    .channel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .channel-title { font-size: 0.85rem; font-weight: 600; }
    .channel-val { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }

    .slider-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 10px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); outline: none; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #ffffff; cursor: pointer;
    }

    .presets { display: flex; gap: 8px; }
    .btn-preset {
      flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 6px 0; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .btn-preset.active { background: rgba(255, 255, 255, 0.15); color: var(--text-main); }

    .status-bar { margin-top: 18px; text-align: center; font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Karaoke Duo Player</h1>
      <p>Spoorbeheer + Pakket Import/Export</p>
    </header>

    <!-- KANTA-EN-KLAAR PAKKET EXPORT / IMPORT -->
    <div class="package-box">
      <div class="package-box-title">📦 Karaoke Pakket (.zip)</div>
      <div class="package-actions">
        <button class="btn-pkg" onclick="document.getElementById('zipInput').click()">1. Laad .zip pakket</button>
        <button class="btn-pkg" id="exportZipBtn" onclick="exportPackage()" disabled>2. Exporteer .zip</button>
      </div>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="file-inputs">
      <div class="file-card" id="musicCard">
        <div class="file-info">
          <span class="file-label music">Muziek Spoor</span>
          <span class="file-name" id="musicName">Laden...</span>
        </div>
        <button class="btn-file" onclick="document.getElementById('musicInput').click()">Kiezen</button>
        <input type="file" id="musicInput" accept="audio/*">
      </div>

      <div class="file-card" id="vocalCard">
        <div class="file-info">
          <span class="file-label vocal">Zang Spoor</span>
          <span class="file-name" id="vocalName">Laden...</span>
        </div>
        <button class="btn-file" onclick="document.getElementById('vocalInput').click()">Kiezen</button>
        <input type="file" id="vocalInput" accept="audio/*">
      </div>

      <div class="file-card loaded" id="lrcCard">
        <div class="file-info">
          <span class="file-label lrc">Karaoke Tekst (.LRC)</span>
          <select id="lrcSelect" class="select-lrc">
            <option value="Marianne40.lrc">Marianne40.lrc</option>
            <option value="OrigineelR2.lrc">OrigineelR2.lrc</option>
          </select>
        </div>
        <button class="btn-file" onclick="document.getElementById('lrcInput').click()">Eigen .LRC</button>
        <input type="file" id="lrcInput" accept=".lrc,.txt">
      </div>
    </div>

    <div class="lyrics-wrapper" id="lyricsWrapper">
      <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <span>Volledig scherm</span>
      </button>

      <button class="btn-close-fullscreen" id="closeFullscreenBtn" onclick="toggleFullscreen()">✕</button>

      <div class="lyrics-container" id="lyricsContainer">
        <div class="lyric-line">Tekst wordt geladen...</div>
      </div>

      <div class="fs-player-overlay" id="fsPlayerOverlay">
        <button class="fs-toggle-btn" id="fsToggleBtn" onclick="toggleFsPanel(event)">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>

        <div class="fs-card-inner">
          <div class="progress-section">
            <input type="range" id="fsSeekSlider" min="0" max="100" value="0" disabled>
            <div class="time-display">
              <span id="fsCurrentTime">00:00</span>
              <span id="fsDurationTime">00:00</span>
            </div>
          </div>

          <div class="controls-main">
            <button id="fsPlayBtn" class="btn-action btn-play" disabled>Afspelen</button>
            <button id="fsStopBtn" class="btn-action btn-stop" disabled>Stop</button>
          </div>

          <div class="channel">
            <div class="channel-header">
              <span class="channel-title" style="color: var(--accent-vocal);">🎤 Zang Volume</span>
              <span class="channel-val" id="fsVocalVolVal">100%</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="fsVocalVol" min="0" max="1" step="0.01" value="1">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="offset-control">
      <div class="offset-header">
        <span class="offset-title">⏱️ Tekst Vertraging:</span>
        <span class="offset-value" id="offsetDisplay">+1.5s</span>
      </div>
      <div class="slider-wrapper">
        <input type="range" id="offsetSlider" min="-5" max="5" step="0.1" value="1.5">
      </div>
    </div>

    <div class="progress-section">
      <input type="range" id="seekSlider" min="0" max="100" value="0" disabled>
      <div class="time-display">
        <span id="currentTime">00:00</span>
        <span id="durationTime">00:00</span>
      </div>
    </div>

    <div class="controls-main">
      <button id="playBtn" class="btn-action btn-play" disabled>Afspelen</button>
      <button id="stopBtn" class="btn-action btn-stop" disabled>Stop</button>
    </div>

    <div class="mixer-section">
      <div class="channel">
        <div class="channel-header">
          <span class="channel-title" style="color: var(--accent-vocal);">🎤 Zang Volume</span>
          <span class="channel-val" id="vocalVolVal">100%</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="vocalVol" min="0" max="1" step="0.01" value="1">
        </div>
      </div>

      <div class="channel">
        <div class="channel-header">
          <span class="channel-title" style="color: var(--accent-music);">🎵 Muziek Volume</span>
          <span class="channel-val" id="musicVolVal">100%</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="musicVol" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">Gereed</div>
  </div>

  <script>
    let audioCtx = null, musicBuffer = null, vocalBuffer = null;
    let musicSource = null, vocalSource = null, musicGainNode = null, vocalGainNode = null;
    let isPlaying = false, startTime = 0, pauseOffset = 0, animFrame = null;
    let lyricsData = [], activeLineIndex = -1, userOffset = 1.5;
    let isUserSeeking = false;

    // Opslag van ruwe bestanden t.b.v. Zip Export
    let rawMusicFile = null, rawVocalFile = null, rawLrcText = "";

    const musicInput = document.getElementById('musicInput');
    const vocalInput = document.getElementById('vocalInput');
    const lrcInput = document.getElementById('lrcInput');
    const lrcSelect = document.getElementById('lrcSelect');
    const zipInput = document.getElementById('zipInput');
    const exportZipBtn = document.getElementById('exportZipBtn');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fsPlayBtn = document.getElementById('fsPlayBtn');
    const fsStopBtn = document.getElementById('fsStopBtn');

    const musicVol = document.getElementById('musicVol');
    const vocalVol = document.getElementById('vocalVol');
    const fsVocalVol = document.getElementById('fsVocalVol');
    const musicVolVal = document.getElementById('musicVolVal');
    const vocalVolVal = document.getElementById('vocalVolVal');
    const fsVocalVolVal = document.getElementById('fsVocalVolVal');

    const statusBar = document.getElementById('statusBar');
    const seekSlider = document.getElementById('seekSlider');
    const fsSeekSlider = document.getElementById('fsSeekSlider');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const fsCurrentTimeEl = document.getElementById('fsCurrentTime');
    const fsDurationTimeEl = document.getElementById('fsDurationTime');

    const lyricsContainer = document.getElementById('lyricsContainer');
    const lyricsWrapper = document.getElementById('lyricsWrapper');
    const offsetDisplay = document.getElementById('offsetDisplay');
    const offsetSlider = document.getElementById('offsetSlider');

    const fsPlayerOverlay = document.getElementById('fsPlayerOverlay');
    const fsToggleBtn = document.getElementById('fsToggleBtn');

    function toggleFsPanel(e) {
      if (e) e.stopPropagation();
      fsPlayerOverlay.classList.toggle('collapsed');
      fsToggleBtn.classList.toggle('collapsed');
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        musicGainNode = audioCtx.createGain();
        vocalGainNode = audioCtx.createGain();
        musicGainNode.connect(audioCtx.destination);
        vocalGainNode.connect(audioCtx.destination);
      }
    }

    async function decodeAudioArrayBuffer(arrayBuffer) {
      initAudio();
      return await audioCtx.decodeAudioData(arrayBuffer);
    }

    function getMaxDuration() {
      return Math.max(musicBuffer?.duration || 0, vocalBuffer?.duration || 0);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function enterFullscreen() {
      if (!document.fullscreenElement && !lyricsWrapper.classList.contains('fullscreen')) {
        if (lyricsWrapper.requestFullscreen) {
          lyricsWrapper.requestFullscreen().catch(() => lyricsWrapper.classList.add('fullscreen'));
        } else {
          lyricsWrapper.classList.add('fullscreen');
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !lyricsWrapper.classList.contains('fullscreen')) {
        enterFullscreen();
      } else {
        if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
        lyricsWrapper.classList.remove('fullscreen');
      }
    }

    musicInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      rawMusicFile = file;
      document.getElementById('musicName').textContent = file.name;
      document.getElementById('musicCard').classList.add('loaded');
      musicBuffer = await decodeAudioArrayBuffer(await file.arrayBuffer());
      checkReady();
    });

    vocalInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      rawVocalFile = file;
      document.getElementById('vocalName').textContent = file.name;
      document.getElementById('vocalCard').classList.add('loaded');
      vocalBuffer = await decodeAudioArrayBuffer(await file.arrayBuffer());
      checkReady();
    });

    lrcInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        rawLrcText = event.target.result;
        parseLRC(rawLrcText);
      };
      reader.readAsText(file);
    });

    function parseLRC(lrcText) {
      lyricsData = [];
      const lineTimeRegex = /^\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)$/;

      lrcText.split('\n').forEach(line => {
        const lineMatch = lineTimeRegex.exec(line);
        if (lineMatch) {
          const time = parseInt(lineMatch[1], 10) * 60 + parseInt(lineMatch[2], 10) + parseInt(lineMatch[3].padEnd(3, '0'), 10) / 1000;
          const cleanText = lineMatch[4].replace(/\[.*?\]/g, '').trim();
          if (cleanText) lyricsData.push({ time, text: cleanText });
        }
      });

      lyricsData.sort((a, b) => a.time - b.time);
      renderLyrics();
    }

    function renderLyrics() {
      lyricsContainer.innerHTML = '';
      if (lyricsData.length === 0) {
        lyricsContainer.innerHTML = '<div class="lyric-line">Geen tekst beschikbaar</div>';
        return;
      }
      lyricsData.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${index}`;
        div.textContent = line.text;
        div.addEventListener('click', () => seekToTime(line.time - userOffset));
        lyricsContainer.appendChild(div);
      });
    }

    function checkReady() {
      const duration = getMaxDuration();
      if (duration > 0) {
        playBtn.disabled = false;
        stopBtn.disabled = false;
        seekSlider.disabled = false;
        fsPlayBtn.disabled = false;
        fsStopBtn.disabled = false;
        fsSeekSlider.disabled = false;
        exportZipBtn.disabled = !(rawMusicFile || rawVocalFile || rawLrcText);
        
        const formatted = formatTime(duration);
        durationTimeEl.textContent = formatted;
        fsDurationTimeEl.textContent = formatted;
        statusBar.textContent = "Klaar voor afspelen.";
      }
    }

    /* ZIP PAKKET EXPORTEREN (Opslaan) */
    async function exportPackage() {
      statusBar.textContent = "ZIP Pakket maken...";
      const zip = new JSZip();

      if (rawMusicFile) zip.file("music_" + rawMusicFile.name, rawMusicFile);
      if (rawVocalFile) zip.file("vocal_" + rawVocalFile.name, rawVocalFile);
      if (rawLrcText) zip.file("lyrics.lrc", rawLrcText);

      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      a.download = "Karaoke_Pakket.zip";
      a.click();
      statusBar.textContent = "Pakket gedownload!";
    }

    /* ZIP PAKKET IMPORTEREN (Laden) */
    zipInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusBar.textContent = "Pakket uitpakken...";
      const zip = new JSZip();
      const zipData = await zip.loadAsync(file);

      for (let filename of Object.keys(zipData.files)) {
        const zipEntry = zipData.files[filename];
        if (zipEntry.dir) continue;

        if (filename.startsWith("music_")) {
          const blob = await zipEntry.async("blob");
          rawMusicFile = new File([blob], filename.replace("music_", ""));
          document.getElementById('musicName').textContent = rawMusicFile.name;
          document.getElementById('musicCard').classList.add('loaded');
          musicBuffer = await decodeAudioArrayBuffer(await rawMusicFile.arrayBuffer());
        } else if (filename.startsWith("vocal_")) {
          const blob = await zipEntry.async("blob");
          rawVocalFile = new File([blob], filename.replace("vocal_", ""));
          document.getElementById('vocalName').textContent = rawVocalFile.name;
          document.getElementById('vocalCard').classList.add('loaded');
          vocalBuffer = await decodeAudioArrayBuffer(await rawVocalFile.arrayBuffer());
        } else if (filename.endsWith(".lrc")) {
          rawLrcText = await zipEntry.async("string");
          parseLRC(rawLrcText);
        }
      }

      checkReady();
      statusBar.textContent = "Pakket succesvol geladen!";
    });

    function startAudio(offset = 0) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopAudioSources();

      const startTimestamp = audioCtx.currentTime + 0.05;

      if (musicBuffer) {
        musicSource = audioCtx.createBufferSource();
        musicSource.buffer = musicBuffer;
        musicSource.connect(musicGainNode);
        musicSource.start(startTimestamp, offset);
      }

      if (vocalBuffer) {
        vocalSource = audioCtx.createBufferSource();
        vocalSource.buffer = vocalBuffer;
        vocalSource.connect(vocalGainNode);
        vocalSource.start(startTimestamp, offset);
      }

      startTime = audioCtx.currentTime - offset;
      isPlaying = true;

      playBtn.textContent = "Pauze";
      fsPlayBtn.textContent = "Pauze";
      statusBar.textContent = "Speelt af...";
      updateProgress();
    }

    function updateProgress() {
      if (!isPlaying) return;
      const currentPos = audioCtx.currentTime - startTime;
      const totalDur = getMaxDuration();

      if (currentPos >= totalDur) { stopAudio(); return; }

      if (!isUserSeeking) {
        const val = (currentPos / totalDur) * 100;
        seekSlider.value = val;
        fsSeekSlider.value = val;
        
        const formattedTime = formatTime(currentPos);
        currentTimeEl.textContent = formattedTime;
        fsCurrentTimeEl.textContent = formattedTime;

        updateLyricsDisplay(currentPos);
      }
      animFrame = requestAnimationFrame(updateProgress);
    }

    function updateLyricsDisplay(currentPos) {
      if (lyricsData.length === 0) return;
      const adjustedTime = currentPos - userOffset;
      let newLineIndex = -1;

      for (let i = 0; i < lyricsData.length; i++) {
        if (adjustedTime >= lyricsData[i].time) newLineIndex = i;
        else break;
      }

      if (newLineIndex !== activeLineIndex) {
        if (activeLineIndex !== -1) document.getElementById(`line-${activeLineIndex}`)?.classList.remove('active');
        if (newLineIndex !== -1) {
          const newEl = document.getElementById(`line-${newLineIndex}`);
          if (newEl) {
            newEl.classList.add('active');
            newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
        activeLineIndex = newLineIndex;
      }
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseOffset = audioCtx.currentTime - startTime;
        stopAudioSources();
        isPlaying = false;
        cancelAnimationFrame(animFrame);
        playBtn.textContent = "Hervatten";
        fsPlayBtn.textContent = "Hervatten";
        statusBar.textContent = "Gepauzeerd.";
      } else {
        enterFullscreen();
        startAudio(pauseOffset);
      }
    }

    playBtn.addEventListener('click', togglePlayPause);
    fsPlayBtn.addEventListener('click', togglePlayPause);

    function stopAudioSources() {
      [musicSource, vocalSource].forEach(src => {
        if (src) { try { src.stop(); src.disconnect(); } catch(e){} }
      });
      musicSource = null; vocalSource = null;
    }

    function stopAudio() {
      stopAudioSources();
      isPlaying = false;
      pauseOffset = 0;
      cancelAnimationFrame(animFrame);
      seekSlider.value = 0;
      fsSeekSlider.value = 0;
      currentTimeEl.textContent = "00:00";
      fsCurrentTimeEl.textContent = "00:00";
      playBtn.textContent = "Afspelen";
      fsPlayBtn.textContent = "Afspelen";
      statusBar.textContent = "Gestopt.";
    }

    stopBtn.addEventListener('click', stopAudio);
    fsStopBtn.addEventListener('click', stopAudio);

    function seekToTime(targetTime) {
      pauseOffset = Math.max(0, targetTime);
      const val = (pauseOffset / getMaxDuration()) * 100;
      seekSlider.value = val;
      fsSeekSlider.value = val;
      if (isPlaying) startAudio(pauseOffset);
    }

    vocalVol.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (vocalGainNode) vocalGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      vocalVolVal.textContent = Math.round(val * 100) + '%';
      fsVocalVolVal.textContent = Math.round(val * 100) + '%';
      fsVocalVol.value = val;
    });

    musicVol.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (musicGainNode) musicGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      musicVolVal.textContent = Math.round(val * 100) + '%';
    });
  </script>
</body>
</html>

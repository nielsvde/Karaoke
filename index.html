<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Karaoke Duo Player + Fullscreen Lyrics</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Karaoke Duo Player","short_name":"KaraokeApp","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://via.placeholder.com/192/6366f1/ffffff?text=Karaoke","sizes":"192x192","type":"image/png"},{"src":"https://via.placeholder.com/512/6366f1/ffffff?text=Karaoke","sizes":"512x512","type":"image/png"}]}'>

  <!-- JSZip bibliotheek voor het maken en uitpakken van zip-bestanden -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #6366f1;
      --accent-vocal: #ec4899;
      --accent-music: #06b6d4;
      --accent-lrc: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    header p { font-size: 0.85rem; color: var(--text-muted); }

    .zip-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .export-group {
      display: flex;
      gap: 8px;
    }
    .input-filename {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .input-filename:focus {
      border-color: var(--primary);
    }
    .btn-zip {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s ease;
    }
    .btn-zip.export-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
    }
    .btn-zip:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .file-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .file-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .file-card.loaded { border-style: solid; border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .file-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 10px; flex: 1; }
    .file-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .file-label.music { color: var(--accent-music); }
    .file-label.vocal { color: var(--accent-vocal); }
    .file-label.lrc { color: var(--accent-lrc); }
    .file-name { font-size: 0.85rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-file {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    input[type="file"] { display: none; }

    .lyrics-wrapper { position: relative; margin-bottom: 12px; }
    .btn-fullscreen {
      position: absolute;
      top: 10px; right: 10px; z-index: 10;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }
    .btn-fullscreen:hover { background: rgba(255, 255, 255, 0.2); }

    .btn-close-fullscreen {
      display: none;
      position: absolute;
      top: 16px; right: 16px; z-index: 10000;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .btn-close-fullscreen:hover { background: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.6); }

    .lyrics-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      height: 180px;
      overflow-y: auto;
      padding: 60px 16px;
      text-align: center;
      scroll-behavior: smooth;
    }
    .lyric-line {
      padding: 8px 12px;
      font-size: 1.05rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 0.25s ease, color 0.25s ease, text-shadow 0.25s ease;
      margin-bottom: 6px;
      line-height: 1.5;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      transform-origin: center center;
    }
    .lyric-line.active {
      font-weight: 700;
      color: #ffffff;
      transform: scale(1.15);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 24px rgba(99, 102, 241, 0.6);
    }

    /* Fullscreen Modus Styling */
    .lyrics-wrapper.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      margin: 0; padding: 20px 20px 0 20px;
      display: flex; flex-direction: column;
    }
    .lyrics-wrapper.fullscreen .lyrics-container { height: 100%; border-radius: 20px; padding: 35vh 20px 180px 20px; }
    .lyrics-wrapper.fullscreen .lyric-line { font-size: 1.8rem; padding: 12px 20px; margin-bottom: 12px; min-height: 64px; }
    .lyrics-wrapper.fullscreen .lyric-line.active { transform: scale(1.2); text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 35px rgba(168, 85, 247, 0.7); }
    .lyrics-wrapper.fullscreen .btn-fullscreen { display: none !important; }
    .lyrics-wrapper.fullscreen .btn-close-fullscreen { display: flex !important; }

    /* Inklapbare spelerbalk onderaan Fullscreen */
    .fs-player-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      z-index: 10001;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
    }
    .lyrics-wrapper.fullscreen .fs-player-overlay {
      display: block;
    }

    .fs-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid var(--border-color);
      border-bottom: none;
      color: var(--text-muted);
      width: 48px;
      height: 24px;
      border-radius: 12px 12px 0 0;
      margin: 0 auto;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .fs-toggle-btn svg { transition: transform 0.3s ease; }
    .fs-toggle-btn.collapsed svg { transform: rotate(180deg); }

    .fs-card-inner {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: max-height 0.35s ease, opacity 0.35s ease, padding 0.35s ease;
      overflow: hidden;
      max-height: 300px;
      opacity: 1;
    }

    .fs-player-overlay.collapsed .fs-card-inner {
      max-height: 0;
      padding: 0 16px;
      border: none;
      opacity: 0;
      pointer-events: none;
    }

    .offset-control {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .offset-header { display: flex; justify-content: space-between; align-items: center; }
    .offset-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .offset-value { font-size: 0.9rem; font-weight: 700; color: var(--accent-lrc); font-family: monospace; }
    .offset-btns { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .btn-offset {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 0;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-offset:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-offset.reset { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

    .progress-section { margin-bottom: 20px; }
    .fs-card-inner .progress-section { margin-bottom: 0; }
    .time-display { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

    .controls-main { display: flex; gap: 12px; margin-bottom: 20px; }
    .fs-card-inner .controls-main { margin-bottom: 0; gap: 10px; }
    .btn-action {
      flex: 1; padding: 14px; border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-play { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
    .btn-play:disabled { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); box-shadow: none; cursor: not-allowed; }
    .btn-stop { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-stop:disabled { opacity: 0.4; cursor: not-allowed; }

    .mixer-section { display: flex; flex-direction: column; gap: 14px; }
    .channel { background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); }
    .fs-card-inner .channel { padding: 10px 12px; }
    .channel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .channel-title { font-size: 0.85rem; font-weight: 600; }
    .channel-val { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }

    .slider-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 10px; }
    .fs-card-inner .slider-wrapper { margin-bottom: 6px; }
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); outline: none; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4); cursor: pointer;
    }

    .presets { display: flex; gap: 8px; }
    .btn-preset {
      flex: 1; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 6px 0; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .btn-preset.active { background: rgba(255, 255, 255, 0.15); color: var(--text-main); border-color: rgba(255, 255, 255, 0.3); }
    .btn-preset.mute.active { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }

    .status-bar { margin-top: 18px; text-align: center; font-size: 0.75rem; color: var(--text-muted); }
    .footer-actions { margin-top: 16px; text-align: center; }
    .btn-install-app {
      width: 100%; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff; border: none; padding: 12px 16px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-install-app:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.6); }
    .btn-install-app:active { transform: translateY(0); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Karaoke Duo Player</h1>
      <p>Synchronisatie per regel</p>
    </header>

    <!-- EXPORT EN IMPORT SECTIE -->
    <div class="zip-actions">
      <div class="export-group">
        <input type="text" id="exportFileNameInput" class="input-filename" placeholder="Bestandsnaam (optioneel)" value="karaoke-package">
        <button class="btn-zip export-btn" onclick="exportToZip()">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Export ZIP
        </button>
      </div>
      <button class="btn-zip" onclick="document.getElementById('zipInput').click()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        Import ZIP
      </button>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="file-inputs">
      <div class="file-card" id="musicCard">
        <div class="file-info">
          <span class="file-label music">Muziek Spoor</span>
          <span class="file-name" id="musicName">Laden...</span>
        </div>
        <button class="btn-file" onclick="document.getElementById('musicInput').click()">Kiezen</button>
        <input type="file" id="musicInput" accept="audio/*">
      </div>

      <div class="file-card" id="vocalCard">
        <div class="file-info">
          <span class="file-label vocal">Zang Spoor</span>
          <span class="file-name" id="vocalName">Laden...</span>
        </div>
        <button class="btn-file" onclick="document.getElementById('vocalInput').click()">Kiezen</button>
        <input type="file" id="vocalInput" accept="audio/*">
      </div>

      <div class="file-card" id="lrcCard">
        <div class="file-info">
          <span class="file-label lrc">Karaoke Tekst (.LRC)</span>
          <span class="file-name" id="lrcName">Laden...</span>
        </div>
        <button class="btn-file" onclick="document.getElementById('lrcInput').click()">Eigen .LRC</button>
        <input type="file" id="lrcInput" accept=".lrc,.txt">
      </div>
    </div>

    <div class="lyrics-wrapper" id="lyricsWrapper">
      <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">
        <svg id="fullscreenIcon" width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
        <span id="fullscreenText">Volledig scherm</span>
      </button>

      <button class="btn-close-fullscreen" id="closeFullscreenBtn" onclick="toggleFullscreen()" title="Sluiten">✕</button>

      <div class="lyrics-container" id="lyricsContainer">
        <div class="lyric-line">Tekst wordt geladen...</div>
      </div>

      <!-- INKLAPBARE SPELER IN FULLSCREEN -->
      <div class="fs-player-overlay" id="fsPlayerOverlay">
        <button class="fs-toggle-btn" id="fsToggleBtn" onclick="toggleFsPanel(event)" title="Paneel in/uitklappen">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
          </svg>
        </button>

        <div class="fs-card-inner">
          <div class="progress-section">
            <input type="range" id="fsSeekSlider" min="0" max="100" value="0" disabled>
            <div class="time-display">
              <span id="fsCurrentTime">00:00</span>
              <span id="fsDurationTime">00:00</span>
            </div>
          </div>

          <div class="controls-main">
            <button id="fsPlayBtn" class="btn-action btn-play" disabled>
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Afspelen
            </button>
            <button id="fsStopBtn" class="btn-action btn-stop" disabled>
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
              Stop
            </button>
          </div>

          <div class="channel">
            <div class="channel-header">
              <span class="channel-title" style="color: var(--accent-vocal);">🎤 Zang Volume</span>
              <span class="channel-val" id="fsVocalVolVal">100%</span>
            </div>
            <div class="slider-wrapper">
              <input type="range" id="fsVocalVol" min="0" max="1" step="0.01" value="1">
            </div>
            <div class="presets">
              <button class="btn-preset mute" id="fsVocalMuteBtn" onclick="setVocalPreset(0)">Mute</button>
              <button class="btn-preset" onclick="setVocalPreset(0.3)">30%</button>
              <button class="btn-preset" onclick="setVocalPreset(0.7)">70%</button>
              <button class="btn-preset active" id="fsPreset100" onclick="setVocalPreset(1.0)">100%</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="offset-control">
      <div class="offset-header">
        <span class="offset-title">⏱️ Tekst Vertraging (Tienden sec.):</span>
        <span class="offset-value" id="offsetDisplay">+1.5s</span>
      </div>
      <div class="slider-wrapper">
        <input type="range" id="offsetSlider" min="-5" max="5" step="0.1" value="1.5">
      </div>
      <div class="offset-btns">
        <button class="btn-offset" onclick="adjustOffset(-0.4)">-0.4s</button>
        <button class="btn-offset" onclick="adjustOffset(-0.2)">-0.2s</button>
        <button class="btn-offset" onclick="adjustOffset(-0.1)">-0.1s</button>
        <button class="btn-offset reset" onclick="setOffset(0.0)">0.0s</button>
        <button class="btn-offset" onclick="adjustOffset(0.1)">+0.1s</button>
        <button class="btn-offset" onclick="adjustOffset(0.2)">+0.2s</button>
        <button class="btn-offset" onclick="adjustOffset(0.4)">+0.4s</button>
      </div>
    </div>

    <div class="progress-section">
      <input type="range" id="seekSlider" min="0" max="100" value="0" disabled>
      <div class="time-display">
        <span id="currentTime">00:00</span>
        <span id="durationTime">00:00</span>
      </div>
    </div>

    <div class="controls-main">
      <button id="playBtn" class="btn-action btn-play" disabled>
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Afspelen
      </button>
      <button id="stopBtn" class="btn-action btn-stop" disabled>
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        Stop
      </button>
    </div>

    <div class="mixer-section">
      <div class="channel">
        <div class="channel-header">
          <span class="channel-title" style="color: var(--accent-vocal);">🎤 Zang Volume</span>
          <span class="channel-val" id="vocalVolVal">100%</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="vocalVol" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="presets">
          <button class="btn-preset mute" id="vocalMuteBtn" onclick="setVocalPreset(0)">Mute</button>
          <button class="btn-preset" onclick="setVocalPreset(0.3)">30%</button>
          <button class="btn-preset" onclick="setVocalPreset(0.7)">70%</button>
          <button class="btn-preset active" id="mainPreset100" onclick="setVocalPreset(1.0)">100%</button>
        </div>
      </div>

      <div class="channel">
        <div class="channel-header">
          <span class="channel-title" style="color: var(--accent-music);">🎵 Muziek Volume</span>
          <span class="channel-val" id="musicVolVal">100%</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="musicVol" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">Bestanden laden uit rootmap...</div>

    <div class="footer-actions">
      <button id="installAppBtn" class="btn-install-app">📲 App Installeren</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }))).catch(() => {});
    }

    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installAppBtn.style.display = 'none';
        deferredPrompt = null;
      } else {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        alert(isIOS 
          ? "Tik op de 'Delen'-knop in je browser en kies 'Zet op beginbodem' om de app te installeren."
          : "Tik op de 3 puntjes van je browsermenu (rechtsboven) en kies 'Toevoegen aan startscherm' of 'App installeren'."
        );
      }
    });

    let audioCtx = null, musicBuffer = null, vocalBuffer = null;
    let musicSource = null, vocalSource = null, musicGainNode = null, vocalGainNode = null;
    let isPlaying = false, startTime = 0, pauseOffset = 0, animFrame = null;
    let lyricsData = [], activeLineIndex = -1;
    
    // Ophalen van de opgeslagen offset-waarde of standaard 1.5 gebruiken
    const savedOffset = localStorage.getItem('karaoke_userOffset');
    let userOffset = savedOffset !== null ? parseFloat(savedOffset) : 1.5;
    
    let isUserSeeking = false;

    // Opslag voor ruwe bestandsdata t.b.v. Zip Export
    let musicFileData = null, musicFileName = "music.mp3";
    let vocalFileData = null, vocalFileName = "vocal.mp3";
    let lrcFileData = null, lrcFileName = "Marianne40.lrc";

    const musicInput = document.getElementById('musicInput');
    const vocalInput = document.getElementById('vocalInput');
    const lrcInput = document.getElementById('lrcInput');
    const zipInput = document.getElementById('zipInput');
    const exportFileNameInput = document.getElementById('exportFileNameInput');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fsPlayBtn = document.getElementById('fsPlayBtn');
    const fsStopBtn = document.getElementById('fsStopBtn');

    const musicVol = document.getElementById('musicVol');
    const vocalVol = document.getElementById('vocalVol');
    const fsVocalVol = document.getElementById('fsVocalVol');
    const musicVolVal = document.getElementById('musicVolVal');
    const vocalVolVal = document.getElementById('vocalVolVal');
    const fsVocalVolVal = document.getElementById('fsVocalVolVal');

    const statusBar = document.getElementById('statusBar');
    const seekSlider = document.getElementById('seekSlider');
    const fsSeekSlider = document.getElementById('fsSeekSlider');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const fsCurrentTimeEl = document.getElementById('fsCurrentTime');
    const fsDurationTimeEl = document.getElementById('fsDurationTime');

    const lyricsContainer = document.getElementById('lyricsContainer');
    const lyricsWrapper = document.getElementById('lyricsWrapper');
    const offsetDisplay = document.getElementById('offsetDisplay');
    const offsetSlider = document.getElementById('offsetSlider');

    const fsPlayerOverlay = document.getElementById('fsPlayerOverlay');
    const fsToggleBtn = document.getElementById('fsToggleBtn');

    function toggleFsPanel(e) {
      if (e) e.stopPropagation();
      fsPlayerOverlay.classList.toggle('collapsed');
      fsToggleBtn.classList.toggle('collapsed');
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        musicGainNode = audioCtx.createGain();
        vocalGainNode = audioCtx.createGain();
        musicGainNode.connect(audioCtx.destination);
        vocalGainNode.connect(audioCtx.destination);
      }
    }

    async function decodeAudioArrayBuffer(arrayBuffer) {
      initAudio();
      return await audioCtx.decodeAudioData(arrayBuffer);
    }

    async function decodeAudioFile(file) {
      return await decodeAudioArrayBuffer(await file.arrayBuffer());
    }

    function getMaxDuration() {
      return Math.max(musicBuffer?.duration || 0, vocalBuffer?.duration || 0);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function enterFullscreen() {
      if (!document.fullscreenElement && !lyricsWrapper.classList.contains('fullscreen')) {
        if (lyricsWrapper.requestFullscreen) {
          lyricsWrapper.requestFullscreen().catch(() => lyricsWrapper.classList.add('fullscreen'));
        } else {
          lyricsWrapper.classList.add('fullscreen');
        }
        updateFullscreenUI();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement && !lyricsWrapper.classList.contains('fullscreen')) {
        enterFullscreen();
      } else {
        if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
        lyricsWrapper.classList.remove('fullscreen');
        updateFullscreenUI();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      lyricsWrapper.classList.toggle('fullscreen', !!document.fullscreenElement);
      updateFullscreenUI();
    });

    function updateFullscreenUI() {
      if (activeLineIndex !== -1) {
        document.getElementById(`line-${activeLineIndex}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    async function loadDefaultFiles() {
      try {
        statusBar.textContent = "Laden van standaard audio en lyrics...";
        
        fetch('./Marianne40audio.mp3')
          .then(res => { if (!res.ok) throw new Error(); return res.arrayBuffer(); })
          .then(async buffer => {
            musicFileData = buffer.slice(0);
            musicFileName = "Marianne40audio.mp3";
            musicBuffer = await decodeAudioArrayBuffer(buffer);
            document.getElementById('musicName').textContent = musicFileName;
            document.getElementById('musicCard').classList.add('loaded');
            checkReady();
          }).catch(() => { document.getElementById('musicName').textContent = "Mislukt (kies handmatig)"; });

        fetch('./Marianne40vocalsoriginal.mp3')
          .then(res => { if (!res.ok) throw new Error(); return res.arrayBuffer(); })
          .then(async buffer => {
            vocalFileData = buffer.slice(0);
            vocalFileName = "Marianne40vocalsoriginal.mp3";
            vocalBuffer = await decodeAudioArrayBuffer(buffer);
            document.getElementById('vocalName').textContent = vocalFileName;
            document.getElementById('vocalCard').classList.add('loaded');
            checkReady();
          }).catch(() => { document.getElementById('vocalName').textContent = "Mislukt (kies handmatig)"; });

        fetch('./Marianne40.lrc')
          .then(res => { if (!res.ok) throw new Error(); return res.text(); })
          .then(text => {
            lrcFileData = text;
            lrcFileName = "Marianne40.lrc";
            document.getElementById('lrcName').textContent = lrcFileName;
            document.getElementById('lrcCard').classList.add('loaded');
            parseLRC(text);
          }).catch(() => { document.getElementById('lrcName').textContent = "Mislukt (kies handmatig)"; });

      } catch (err) {
        statusBar.textContent = "Automatisch laden mislukt, kies bestanden handmatig.";
      }
    }

    musicInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      musicFileName = file.name;
      musicFileData = await file.arrayBuffer();
      document.getElementById('musicName').textContent = file.name;
      document.getElementById('musicCard').classList.add('loaded');
      try { musicBuffer = await decodeAudioArrayBuffer(musicFileData.slice(0)); checkReady(); } 
      catch (err) { statusBar.textContent = "Fout bij laden van muziek."; }
    });

    vocalInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      vocalFileName = file.name;
      vocalFileData = await file.arrayBuffer();
      document.getElementById('vocalName').textContent = file.name;
      document.getElementById('vocalCard').classList.add('loaded');
      try { vocalBuffer = await decodeAudioArrayBuffer(vocalFileData.slice(0)); checkReady(); } 
      catch (err) { statusBar.textContent = "Fout bij laden van zang."; }
    });

    lrcInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      lrcFileName = file.name;
      document.getElementById('lrcName').textContent = file.name;
      document.getElementById('lrcCard').classList.add('loaded');
      const reader = new FileReader();
      reader.onload = (event) => {
        lrcFileData = event.target.result;
        parseLRC(lrcFileData);
      };
      reader.readAsText(file);
    });

    /* ZIP EXPORT EN IMPORT FUNCTIONALITEIT */
    async function exportToZip() {
      if (!musicFileData || !vocalFileData || !lrcFileData) {
        alert("Zorg dat het muziekspoor, het zangspoor en de lyrics zijn ingeladen voordat je exporteert.");
        return;
      }

      let customName = exportFileNameInput.value.trim() || "karaoke-package";
      if (!customName.toLowerCase().endsWith('.zip')) {
        customName += '.zip';
      }

      statusBar.textContent = "ZIP bestand maken...";
      try {
        const zip = new JSZip();
        zip.file(musicFileName, musicFileData);
        zip.file(vocalFileName, vocalFileData);
        zip.file(lrcFileName, lrcFileData);

        const settings = {
          userOffset: userOffset,
          exportDate: new Date().toISOString()
        };
        zip.file("config.json", JSON.stringify(settings, null, 2));

        const content = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = customName;
        a.click();
        URL.revokeObjectURL(a.href);
        statusBar.textContent = `ZIP bestand (${customName}) succesvol geëxporteerd!`;
      } catch (err) {
        console.error(err);
        statusBar.textContent = "Fout bij maken van ZIP-bestand.";
      }
    }

    zipInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusBar.textContent = "ZIP bestand uitpakken...";
      try {
        const zip = await JSZip.loadAsync(file);
        let foundMusic = false, foundVocal = false, foundLrc = false;

        const zipNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
        exportFileNameInput.value = zipNameWithoutExt;

        if (zip.files["config.json"]) {
          try {
            const configText = await zip.files["config.json"].async("string");
            const config = JSON.parse(configText);
            if (config.userOffset !== undefined) {
              setOffset(config.userOffset);
            }
          } catch (configErr) {
            console.warn("Kon config.json niet verwerken", configErr);
          }
        }

        for (const filename of Object.keys(zip.files)) {
          const zipEntry = zip.files[filename];
          if (zipEntry.dir) continue;

          const lowerName = filename.toLowerCase();

          if (lowerName.endsWith('.lrc') || lowerName.endsWith('.txt')) {
            lrcFileName = filename;
            lrcFileData = await zipEntry.async('string');
            document.getElementById('lrcName').textContent = filename;
            document.getElementById('lrcCard').classList.add('loaded');
            parseLRC(lrcFileData);
            foundLrc = true;
          } else if (lowerName.includes('vocal') || lowerName.includes('zang')) {
            vocalFileName = filename;
            vocalFileData = await zipEntry.async('arraybuffer');
            vocalBuffer = await decodeAudioArrayBuffer(vocalFileData.slice(0));
            document.getElementById('vocalName').textContent = filename;
            document.getElementById('vocalCard').classList.add('loaded');
            foundVocal = true;
          } else if (lowerName.endsWith('.mp3') || lowerName.endsWith('.wav') || lowerName.endsWith('.m4a') || lowerName.endsWith('.ogg')) {
            if (!foundMusic) {
              musicFileName = filename;
              musicFileData = await zipEntry.async('arraybuffer');
              musicBuffer = await decodeAudioArrayBuffer(musicFileData.slice(0));
              document.getElementById('musicName').textContent = filename;
              document.getElementById('musicCard').classList.add('loaded');
              foundMusic = true;
            } else if (!foundVocal) {
              vocalFileName = filename;
              vocalFileData = await zipEntry.async('arraybuffer');
              vocalBuffer = await decodeAudioArrayBuffer(vocalFileData.slice(0));
              document.getElementById('vocalName').textContent = filename;
              document.getElementById('vocalCard').classList.add('loaded');
              foundVocal = true;
            }
          }
        }

        checkReady();
        statusBar.textContent = "ZIP bestand succesvol ingeladen!";
      } catch (err) {
        console.error(err);
        statusBar.textContent = "Fout bij uitpakken van ZIP-bestand.";
      }
    });

    function parseLRC(lrcText) {
      lyricsData = [];
      const lineTimeRegex = /^\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)$/;

      lrcText.split('\n').forEach(line => {
        const lineMatch = lineTimeRegex.exec(line);
        if (lineMatch) {
          const time = parseInt(lineMatch[1], 10) * 60 + parseInt(lineMatch[2], 10) + parseInt(lineMatch[3].padEnd(3, '0'), 10) / 1000;
          const cleanText = lineMatch[4].replace(/\[.*?\]/g, '').trim();
          if (cleanText) lyricsData.push({ time, text: cleanText });
        }
      });

      lyricsData.sort((a, b) => a.time - b.time);
      renderLyrics();
    }

    function renderLyrics() {
      lyricsContainer.innerHTML = '';
      if (lyricsData.length === 0) {
        lyricsContainer.innerHTML = '<div class="lyric-line">Geen geldige tekst gevonden</div>';
        return;
      }
      lyricsData.forEach((line, index) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `line-${index}`;
        div.textContent = line.text;
        div.addEventListener('click', () => seekToTime(line.time - userOffset));
        lyricsContainer.appendChild(div);
      });
    }

    function updateOffsetDisplay() {
      offsetDisplay.textContent = `${userOffset > 0 ? '+' : ''}${userOffset.toFixed(1)}s`;
      offsetSlider.value = userOffset;
      localStorage.setItem('karaoke_userOffset', userOffset);
      if (audioCtx) updateLyricsDisplay(isPlaying ? (audioCtx.currentTime - startTime) : pauseOffset);
    }

    function adjustOffset(delta) { userOffset = parseFloat((userOffset + delta).toFixed(1)); updateOffsetDisplay(); }
    function setOffset(val) { userOffset = parseFloat(val); updateOffsetDisplay(); }
    offsetSlider.addEventListener('input', (e) => setOffset(e.target.value));

    function updateLyricsDisplay(currentPos) {
      if (lyricsData.length === 0) return;
      const adjustedTime = currentPos - userOffset;
      let newLineIndex = -1;

      for (let i = 0; i < lyricsData.length; i++) {
        if (adjustedTime >= lyricsData[i].time) newLineIndex = i;
        else break;
      }

      if (newLineIndex !== activeLineIndex) {
        if (activeLineIndex !== -1) document.getElementById(`line-${activeLineIndex}`)?.classList.remove('active');
        if (newLineIndex !== -1) {
          const newEl = document.getElementById(`line-${newLineIndex}`);
          if (newEl) {
            newEl.classList.add('active');
            newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
        activeLineIndex = newLineIndex;
      }
    }

    function checkReady() {
      const duration = getMaxDuration();
      if (duration > 0) {
        playBtn.disabled = false;
        stopBtn.disabled = false;
        seekSlider.disabled = false;
        fsPlayBtn.disabled = false;
        fsStopBtn.disabled = false;
        fsSeekSlider.disabled = false;
        
        const formatted = formatTime(duration);
        durationTimeEl.textContent = formatted;
        fsDurationTimeEl.textContent = formatted;
        statusBar.textContent = "Klaar om af te spelen!";
      }
    }

    function startAudio(offset = 0) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopAudioSources();

      const startTimestamp = audioCtx.currentTime + 0.05;

      if (musicBuffer) {
        musicSource = audioCtx.createBufferSource();
        musicSource.buffer = musicBuffer;
        musicSource.connect(musicGainNode);
        musicSource.start(startTimestamp, offset);
      }

      if (vocalBuffer) {
        vocalSource = audioCtx.createBufferSource();
        vocalSource.buffer = vocalBuffer;
        vocalSource.connect(vocalGainNode);
        vocalSource.start(startTimestamp, offset);
      }

      startTime = audioCtx.currentTime - offset;
      isPlaying = true;

      const pauseBtnHtml = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pauze`;
      playBtn.innerHTML = pauseBtnHtml;
      fsPlayBtn.innerHTML = pauseBtnHtml;
      statusBar.textContent = "Speelt af...";
      updateProgress();
    }

    function updateProgress() {
      if (!isPlaying) return;
      const currentPos = audioCtx.currentTime - startTime;
      const totalDur = getMaxDuration();

      if (currentPos >= totalDur) { stopAudio(); return; }

      if (!isUserSeeking) {
        const val = (currentPos / totalDur) * 100;
        seekSlider.value = val;
        fsSeekSlider.value = val;
        
        const formattedTime = formatTime(currentPos);
        currentTimeEl.textContent = formattedTime;
        fsCurrentTimeEl.textContent = formattedTime;

        updateLyricsDisplay(currentPos);
      }
      animFrame = requestAnimationFrame(updateProgress);
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseOffset = audioCtx.currentTime - startTime;
        stopAudioSources();
        isPlaying = false;
        cancelAnimationFrame(animFrame);
        
        const resumeBtnHtml = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Hervatten`;
        playBtn.innerHTML = resumeBtnHtml;
        fsPlayBtn.innerHTML = resumeBtnHtml;
        statusBar.textContent = "Gepauzeerd.";
      } else {
        startAudio(pauseOffset);
      }
    }

    playBtn.addEventListener('click', togglePlayPause);
    fsPlayBtn.addEventListener('click', togglePlayPause);

    function stopAudioSources() {
      [musicSource, vocalSource].forEach(src => {
        if (src) { try { src.stop(); src.disconnect(); } catch(e){} }
      });
      musicSource = null; vocalSource = null;
    }

    function stopAudio() {
      stopAudioSources();
      isPlaying = false;
      pauseOffset = 0;
      cancelAnimationFrame(animFrame);
      
      seekSlider.value = 0;
      fsSeekSlider.value = 0;
      currentTimeEl.textContent = "00:00";
      fsCurrentTimeEl.textContent = "00:00";
      
      const playBtnHtml = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Afspelen`;
      playBtn.innerHTML = playBtnHtml;
      fsPlayBtn.innerHTML = playBtnHtml;
      statusBar.textContent = "Gestopt.";
    }

    stopBtn.addEventListener('click', stopAudio);
    fsStopBtn.addEventListener('click', stopAudio);

    function seekToTime(targetTime) {
      pauseOffset = Math.max(0, targetTime);
      const val = (pauseOffset / getMaxDuration()) * 100;
      seekSlider.value = val;
      fsSeekSlider.value = val;
      
      const formattedTime = formatTime(pauseOffset);
      currentTimeEl.textContent = formattedTime;
      fsCurrentTimeEl.textContent = formattedTime;

      updateLyricsDisplay(pauseOffset);
      if (isPlaying) startAudio(pauseOffset);
    }

    function setupSeekEvents(slider) {
      slider.addEventListener('mousedown', () => { isUserSeeking = true; });
      slider.addEventListener('touchstart', () => { isUserSeeking = true; });

      slider.addEventListener('input', (e) => {
        const targetTime = (e.target.value / 100) * getMaxDuration();
        const formattedTime = formatTime(targetTime);
        currentTimeEl.textContent = formattedTime;
        fsCurrentTimeEl.textContent = formattedTime;
        seekSlider.value = e.target.value;
        fsSeekSlider.value = e.target.value;
        updateLyricsDisplay(targetTime);
      });

      slider.addEventListener('change', (e) => {
        isUserSeeking = false;
        pauseOffset = (e.target.value / 100) * getMaxDuration();
        if (isPlaying) startAudio(pauseOffset);
      });
    }

    setupSeekEvents(seekSlider);
    setupSeekEvents(fsSeekSlider);

    vocalVol.addEventListener('input', (e) => applyVocalVolume(parseFloat(e.target.value)));
    fsVocalVol.addEventListener('input', (e) => applyVocalVolume(parseFloat(e.target.value)));

    musicVol.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (musicGainNode) musicGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      musicVolVal.textContent = Math.round(val * 100) + '%';
    });

    function applyVocalVolume(val) {
      if (vocalGainNode) vocalGainNode.gain.setValueAtTime(val, audioCtx.currentTime);
      vocalVol.value = val;
      fsVocalVol.value = val;
      const text = Math.round(val * 100) + '%';
      vocalVolVal.textContent = text;
      fsVocalVolVal.textContent = text;

      document.querySelectorAll('.presets .btn-preset').forEach(btn => btn.classList.remove('active'));
      if (val === 0) {
        document.getElementById('vocalMuteBtn')?.classList.add('active');
        document.getElementById('fsVocalMuteBtn')?.classList.add('active');
      } else if (val === 1.0) {
        document.getElementById('mainPreset100')?.classList.add('active');
        document.getElementById('fsPreset100')?.classList.add('active');
      }
    }

    function setVocalPreset(val) { applyVocalVolume(val); }

    lyricsContainer.addEventListener('click', (e) => {
      if (lyricsWrapper.classList.contains('fullscreen') && !e.target.classList.contains('lyric-line')) {
        toggleFullscreen();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateOffsetDisplay();
      loadDefaultFiles();
    });
  </script>
</body>
</html>
